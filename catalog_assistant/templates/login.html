<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homebox Restock — Login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 400px; margin: 4rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.2rem; }
  input[type="password"] { width: 100%; padding: 0.6rem; font-size: 1.1rem; box-sizing: border-box; margin: 0.75rem 0; }
  button { width: 100%; padding: 0.6rem; font-size: 1.05rem; cursor: pointer; }
  .error { color: #b00020; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Homebox Restock</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST">
  <input type="password" name="secret" placeholder="Password" autofocus required>
  <button type="submit">Log in</button>
</form>
</body>
</html>
